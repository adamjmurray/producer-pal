# See the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    # Both nested manifests are dependency-free today (they ship the bundled
    # portal). Listed so any future dependency is covered from day one.
    directories:
      - "/"
      - "/claude-desktop-extension"
      - "/npm"
    target-branch: "dev"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      ai:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
          - "@openai/agents"
          - "@google/genai"
      build:
        patterns:
          - "rolldown"
          - "vite"
          - "vite-plugin-*"
          - "vitepress"
          - "peggy"
          - "chokidar-cli"
          - "@anthropic-ai/mcpb"
      # oxlint pins an exact tsgolint build, so those two must move together or
      # `npm ci` resolves a mismatched pair. The eslint plugins are here too:
      # oxlint runs them through its jsPlugins bridge, natively implementing
      # none of their rules (unicorn is the partial case — see dev/Linting.md).
      static-analysis:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "oxfmt"
          - "eslint-plugin-*"
          - "@eslint-community/*"
          - "@stylistic/eslint-plugin"
          - "jscpd"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "happy-dom"
          - "fake-indexeddb"
      webui:
        patterns:
          - "preact"
          - "@preact/*"
          - "@tailwindcss/*"
          - "@codemirror/*"
          - "@lezer/*"
          - "marked"
          - "dompurify"
          - "idb"
      # The two compilers are installed side-by-side under npm aliases and have
      # to move together — see AGENTS.md.
      typescript:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "@types/*"
      server:
        patterns:
          - "express"
          - "zod"
          - "@modelcontextprotocol/*"
      evals:
        patterns:
          - "undici"
          - "commander"
      # Everything left, plus anything added later. Dependabot assigns a
      # dependency to the first group it matches, so this stays last.
      misc:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
