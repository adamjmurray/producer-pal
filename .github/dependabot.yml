# See the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    # Both nested manifests are dependency-free today (they ship the bundled
    # portal). Listed so any future dependency is covered from day one.
    directories:
      - "/"
      - "/claude-desktop-extension"
      - "/npm"
    target-branch: "dev"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      ai-libraries:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
          - "@openai/agents"
          - "@google/genai"
      anthropic:
        patterns:
          - "@anthropic-ai/*"
          - "@modelcontextprotocol/*"
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      rollup:
        patterns:
          - "rollup"
          - "@rollup/*"
          - "rollup-plugin-*"
      # oxlint replaced eslint, but four eslint plugins remain: oxlint runs them
      # through its jsPlugins bridge, natively implementing none of their rules
      # (unicorn is the partial case — see dev/Linting.md).
      lint-plugins:
        patterns:
          - "eslint-plugin-*"
          - "@eslint-community/*"
          - "@stylistic/eslint-plugin"
      # oxlint pins an exact tsgolint build, so the two must move together or
      # `npm ci` resolves a mismatched pair.
      oxlint:
        patterns:
          - "oxlint"
          - "oxlint-*"
      vite:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "vitepress"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      preact:
        patterns:
          - "preact"
          - "@preact/*"
          - "@testing-library/preact"
      tailwind:
        patterns:
          - "@tailwindcss/*"
      stryker:
        patterns:
          - "@stryker-mutator/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
