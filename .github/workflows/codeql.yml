name: "CodeQL"

# Advanced setup, so the scan can skip tests and tooling (see
# .github/codeql/codeql-config.yml). GitHub's default setup must be disabled
# in the repo settings: while it's on, GitHub rejects these uploads.

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL trial (${{ matrix.language }}, ${{ matrix.scope }})
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, scope: shipped }
          - { language: javascript-typescript, scope: shipped }
          - { language: python, scope: shipped }
          # TRIAL: the whole repo, as default setup scans it, for comparison.
          - { language: javascript-typescript, scope: all }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file:
            ${{ matrix.scope == 'shipped' &&
            './.github/codeql/codeql-config.yml' || '' }}

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          # TRIAL: default setup is still on and would reject the upload.
          upload: never
