<svg class="pp idle" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-label="Producer Pal logo">
  <style>
.pp .eye, .pp .screen, .pp .body, .pp .pal, .pp .eyes {
  transform-box: fill-box;
  transform-origin: center;
}
.pp.idle .eyes-l .eye { animation: blink-id 3.6s infinite; }
.pp.idle .eyes-r .eye { animation: blink-id 4.9s infinite; animation-delay: -1.2s; }
.pp.idle .pal-l       { animation: bow-l-id 11s infinite ease-in-out; }
.pp.idle .pal-r       { animation: bow-r-id 11s infinite ease-in-out; }
@keyframes blink-id {
  0%, 91%, 100% { transform: scaleY(1); }
  94%, 96%      { transform: scaleY(0.08); }
}
@keyframes bow-l-id {
  0%, 62%, 86%, 100% { transform: rotate(0deg) translateY(0); }
  72%, 78%           { transform: rotate(6deg) translateY(4px); }
}
@keyframes bow-r-id {
  0%, 62%, 86%, 100% { transform: rotate(0deg) translateY(0); }
  72%, 78%           { transform: rotate(-6deg) translateY(4px); }
}</style>
