[build]
command = "npm run docs:build"
publish = "docs/.vitepress/dist"
# Watches all of src/ because the tool reference's example output is produced by
# running the tools: notation formats the notes, the adapter dispatches, the
# connect helpers build the appended blocks. Listing subpaths went stale as soon
# as that landed.
#
# Keep this list in step with deploy-docs.yml's paths filter: the same commit has
# to rebuild both sites, or producer-pal.org serves a stale copy of one. That is
# what examples/skills/ is doing here — it is zipped into the downloads and
# inlined into the skills guide.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF docs/ src/ examples/skills/ scripts/build-and-release/generate-docs-markdown.ts scripts/build-and-release/generate-skill-downloads.ts scripts/build-and-release/tool-reference/"

[build.environment]
NODE_VERSION = "24"

[context.branch-deploy]
command = "npm run docs:build"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
