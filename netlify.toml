[build]
  command = "npm run docs:build"
  publish = "docs/.vitepress/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF docs/ src/shared/version.ts src/tools/ src/skills/ scripts/build-and-release/generate-docs-markdown.ts scripts/build-and-release/generate-tool-schema-docs.ts"

[build.environment]
  NODE_VERSION = "24"

[context.branch-deploy]
  command = "npm run docs:build"

# Moved pages. These must precede the catch-all below, which would otherwise
# serve the homepage with a 200 and hide the move from users and crawlers.
[[redirects]]
  from = "/guide/examples"
  to = "/features/examples"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200